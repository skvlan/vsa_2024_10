

services:
  backend:
    build: ./
    container_name: carmarket_container
    working_dir: /carmarket
    ports:
      - 8010:8000
    command:
      - ./commands/start_server_dev.sh
    volumes:
      - ./src:/carmarket/src
      - ./commands:/carmarket/commands
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres:16.4
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    env_file:
      - .env

#  nginx:
#    ...
#  redis:
#    ...
#

volumes:
  pg_data: { }